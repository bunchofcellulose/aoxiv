desc: |
  The Olimpiada Republicanǎ de Astronomie și Astrofizicǎ (ORAA) serves as the primary selection mechanism for Moldova's team to the International Olympiad on Astronomy and Astrophysics (IOAA). The competition tests theoretical knowledge, observational skills, and problem-solving abilities in astronomy and astrophysics. The competition consists of a Junior and a Senior division, with the top performers in the Senior division being selected for the national IOAA team. The ORAA is organized annually and attracts students from across Moldova who are passionate about astronomy and astrophysics.
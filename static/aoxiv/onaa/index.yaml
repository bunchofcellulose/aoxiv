desc: |
  The Olimpiada Națională de Astronomie și Astrofizică (ONAA) serves as the primary selection mechanism for Romania's team to the International Olympiad on Astronomy and Astrophysics (IOAA). The competition tests theoretical knowledge, observational skills, and problem-solving abilities in astronomy and astrophysics. The competition consists of a Junior and a Senior division, with the top performers in the Senior division being selected for the national IOAA team. The ONAA is organized annually and attracts students from across Romania who are passionate about astronomy and astrophysics. The selections for writing ONAA is conducted by OJAA, Olimpiada Județeană de Astronomie și Astrofizică, which is the county-level astronomy olympiad.